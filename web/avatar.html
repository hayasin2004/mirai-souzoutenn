<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mirai Avatar Screen｜AI映像出力画面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070913;
      --surface: rgba(20, 24, 42, 0.78);
      --border: rgba(140, 160, 255, 0.22);
      --accent: #9b6dff;
      --accent-2: #2ed5ff;
      --text: #f3f5ff;
      --text-dim: #9aa3c2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 20%, #171d38 0%, #060811 75%);
      color: var(--text);
      font-family: "Outfit", "Noto Sans JP", system-ui, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 待機時の静止画 & 発話時の動画 */
    .media-frame {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #avatar-idle-img,
    #avatar-idle-video,
    #avatar-video {
      max-width: 100%;
      max-height: 100%;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: opacity 0.25s ease;
    }

    #avatar-idle-video,
    #avatar-video {
      position: absolute;
      inset: 0;
      margin: auto;
      opacity: 0;
      pointer-events: none;
    }

    #avatar-idle-video.is-ready {
      opacity: 1;
    }

    #avatar-video.is-playing {
      opacity: 1;
      pointer-events: auto;
      z-index: 2;
    }

    /* 上部コントロールバー（非表示） */
    .top-bar {
      display: none !important;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 10px #4ade80;
    }
    .status-dot.is-generating {
      background: #facc15;
      box-shadow: 0 0 12px #facc15;
      animation: pulse 1s infinite;
    }
    .status-dot.is-playing {
      background: #2ed5ff;
      box-shadow: 0 0 12px #2ed5ff;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.6; }
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn, select.source-select {
      font: inherit;
      font-size: 0.82rem;
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover, select.source-select:hover {
      background: rgba(155, 109, 255, 0.25);
      border-color: var(--accent);
    }
    select.source-select option {
      background: #121629;
      color: #fff;
    }

    /* 字幕・状態オーバーレイ */
    .subtitle-box {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      max-width: min(820px, 90vw);
      padding: 12px 24px;
      border-radius: 16px;
      background: rgba(10, 13, 24, 0.82);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
      text-align: center;
      z-index: 15;
      transition: opacity 0.3s ease;
    }
    .subtitle-box.is-hidden {
      opacity: 0;
      pointer-events: none;
    }
    .subtitle-speaker {
      font-size: 0.78rem;
      color: var(--accent-2);
      font-weight: 600;
      margin-bottom: 4px;
    }
    .subtitle-text {
      font-size: clamp(1rem, 2vw, 1.35rem);
      font-weight: 500;
      line-height: 1.5;
    }

    /* 映像生成中ローディングバッジ */
    .generating-overlay {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      border-radius: 999px;
      background: rgba(16, 20, 38, 0.88);
      border: 1px solid rgba(46, 213, 255, 0.45);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      z-index: 18;
      font-size: 0.88rem;
      color: #fff;
    }
    .generating-overlay.is-active {
      display: inline-flex;
    }
    .spinner {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: var(--accent-2);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 展示用フローティングマイクボタン（文字なし・右下） */
    .avatar-mic-btn {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(16, 20, 38, 0.52);
      backdrop-filter: blur(10px);
      color: #fff;
      font-size: 1.55rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      z-index: 25;
      opacity: 0.45;
      transition: all 0.2s ease;
    }
    .avatar-mic-btn:hover {
      opacity: 1;
      border-color: var(--accent-2);
      transform: scale(1.06);
    }
    .avatar-mic-btn.is-recording {
      opacity: 1;
      background: rgba(239, 68, 68, 0.85);
      border-color: #fca5a5;
      box-shadow: 0 0 22px rgba(239, 68, 68, 0.75);
      animation: micPulse 1.1s ease-in-out infinite;
    }
    .avatar-mic-btn.is-busy {
      opacity: 0.85;
      border-color: var(--accent-2);
      cursor: wait;
    }
    @keyframes micPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
  </style>
</head>
<body>
  <header class="top-bar" id="top-bar">
    <div class="brand-title">
      <span id="status-dot" class="status-dot"></span>
      <span>Mirai Avatar Screen（映像出力専用画面）</span>
      <span id="status-label" style="font-weight: 400; font-size: 0.82rem; color: var(--text-dim);">待機中</span>
    </div>
    <div class="controls">
      <select id="avatar-source-select" class="source-select" title="アバター顔画像を切り替え"></select>
      <label class="btn" title="新しい顔画像をアップロード">
        📷 画像追加
        <input type="file" id="avatar-upload-input" accept="image/*,video/mp4" style="display: none;">
      </label>
      <button id="toggle-sub-btn" class="btn" type="button">💬 字幕: OFF</button>
      <button id="replay-btn" class="btn" type="button" style="display: none;">▶ もう一度再生</button>
      <button id="fullscreen-btn" class="btn" type="button">⛶ 全画面表示</button>
    </div>
  </header>

  <div id="generating-overlay" class="generating-overlay">
    <span class="spinner"></span>
    <span id="generating-text">チャット返答からリップシンク映像を生成しています...</span>
  </div>

  <main class="stage">
    <div class="media-frame">
      <img id="avatar-idle-img" src="/avatars/AbeHiroshi.jpg" alt="Avatar Idle">
      <video id="avatar-idle-video" loop muted autoplay playsinline></video>
      <video id="avatar-video" playsinline></video>
    </div>
  </main>

  <div id="subtitle-box" class="subtitle-box is-hidden">
    <div id="subtitle-speaker" class="subtitle-speaker">AI</div>
    <div id="subtitle-text" class="subtitle-text"></div>
  </div>

  <button id="avatar-mic-btn" class="avatar-mic-btn" type="button" title="音声で話しかける（Spaceキーでも操作可）" aria-label="音声入力">🎤</button>

  <script>
    const idleImg = document.getElementById("avatar-idle-img");
    const idleVideoEl = document.getElementById("avatar-idle-video");
    const videoEl = document.getElementById("avatar-video");
    const statusDot = document.getElementById("status-dot");
    const statusLabel = document.getElementById("status-label");
    const sourceSelect = document.getElementById("avatar-source-select");
    const uploadInput = document.getElementById("avatar-upload-input");
    const toggleSubBtn = document.getElementById("toggle-sub-btn");
    const replayBtn = document.getElementById("replay-btn");
    const fullscreenBtn = document.getElementById("fullscreen-btn");
    const subtitleBox = document.getElementById("subtitle-box");
    const subtitleSpeaker = document.getElementById("subtitle-speaker");
    const subtitleText = document.getElementById("subtitle-text");
    const generatingOverlay = document.getElementById("generating-overlay");

    let showSubtitle = false;
    let lastVideoId = 0;
    let lastVideoUrl = null;
    let currentSourceFilename = "";
    let currentIdleVideoUrl = "";
    let idleVideoPlaylist = [];
    let currentIdleIdx = 0;

    function pickNextIdleIndex() {
      if (idleVideoPlaylist.length <= 1) return 0;
      const candidates = [];
      for (let i = 0; i < idleVideoPlaylist.length; i++) {
        if (i !== currentIdleIdx) candidates.push(i);
      }
      return candidates[Math.floor(Math.random() * candidates.length)];
    }

    function playIdleIndex(idx) {
      if (!idleVideoPlaylist.length) return;
      currentIdleIdx = idx % idleVideoPlaylist.length;
      const targetUrl = idleVideoPlaylist[currentIdleIdx];
      currentIdleVideoUrl = targetUrl;
      idleVideoEl.loop = (idleVideoPlaylist.length === 1);
      idleVideoEl.src = targetUrl;
      idleVideoEl.onloadeddata = () => {
        idleVideoEl.classList.add("is-ready");
        idleVideoEl.play().catch(() => {});
      };
      idleVideoEl.play().catch(() => {});
    }

    idleVideoEl.addEventListener("ended", () => {
      if (idleVideoPlaylist.length > 1) {
        playIdleIndex(pickNextIdleIndex());
      }
    });

    function setIdleLoopVideo(idleUrlsOrSingle) {
      const list = Array.isArray(idleUrlsOrSingle)
        ? idleUrlsOrSingle.filter(Boolean)
        : (idleUrlsOrSingle ? [idleUrlsOrSingle] : []);
      if (!list.length) {
        idleVideoPlaylist = [];
        currentIdleVideoUrl = "";
        idleVideoEl.classList.remove("is-ready");
        idleVideoEl.removeAttribute("src");
        return;
      }
      const sameList = list.length === idleVideoPlaylist.length && list.every((u, i) => u === idleVideoPlaylist[i]);
      idleVideoPlaylist = list;
      idleVideoEl.loop = (idleVideoPlaylist.length === 1);
      if (sameList && idleVideoEl.classList.contains("is-ready")) {
        if (idleVideoEl.paused) idleVideoEl.play().catch(() => {});
        return;
      }
      // すでに再生中のリストに新しいバリエーションが追加された場合は、今の再生を止めずに次の切り替えから使う
      if (currentIdleVideoUrl && idleVideoPlaylist.includes(currentIdleVideoUrl) && idleVideoEl.classList.contains("is-ready")) {
        currentIdleIdx = idleVideoPlaylist.indexOf(currentIdleVideoUrl);
        return;
      }
      playIdleIndex(0);
    }

    // BroadcastChannel でチャット画面からの即時イベントも受信
    const bc = ("BroadcastChannel" in window) ? new BroadcastChannel("mirai_avatar_channel") : null;
    if (bc) {
      bc.onmessage = (ev) => {
        const msg = ev.data || {};
        if (msg.type === "state_update" && msg.state) {
          applyAvatarState(msg.state);
        }
      };
    }

    async function loadSources() {
      try {
        const res = await fetch("/api/avatar/sources");
        const data = await res.json();
        sourceSelect.innerHTML = "";
        for (const s of (data.sources || [])) {
          const opt = document.createElement("option");
          opt.value = s.filename;
          opt.textContent = `👤 ${s.filename}`;
          sourceSelect.appendChild(opt);
        }
        if (data.current_source) {
          currentSourceFilename = data.current_source;
          sourceSelect.value = data.current_source;
          idleImg.src = `/avatars/${encodeURIComponent(data.current_source)}`;
          setIdleLoopVideo(data.idle_video_urls || data.idle_video_url || null);
        }
      } catch (e) {
        console.warn("Failed to load avatar sources:", e);
      }
    }

    sourceSelect.addEventListener("change", async () => {
      const filename = sourceSelect.value;
      if (!filename) return;
      try {
        const res = await fetch("/api/avatar/sources", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ filename }),
        });
        const data = await res.json();
        if (res.ok && data.current_source) {
          currentSourceFilename = data.current_source;
          idleImg.src = `/avatars/${encodeURIComponent(data.current_source)}`;
          setIdleLoopVideo(data.idle_video_urls || data.idle_video_url || null);
          if (bc) bc.postMessage({ type: "source_changed", filename: data.current_source });
        }
      } catch (e) {
        console.warn(e);
      }
    });

    uploadInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const fd = new FormData();
      fd.append("file", file);
      try {
        const res = await fetch("/api/avatar/sources", { method: "POST", body: fd });
        const data = await res.json();
        if (res.ok) {
          await loadSources();
          if (bc) bc.postMessage({ type: "source_changed", filename: data.current_source });
        }
      } catch (err) {
        console.warn(err);
      }
    });

    toggleSubBtn.addEventListener("click", () => {
      showSubtitle = !showSubtitle;
      toggleSubBtn.textContent = `💬 字幕: ${showSubtitle ? "ON" : "OFF"}`;
      if (!showSubtitle) {
        subtitleBox.classList.add("is-hidden");
      } else if (subtitleText.textContent) {
        subtitleBox.classList.remove("is-hidden");
      }
    });

    replayBtn.addEventListener("click", () => {
      if (lastVideoUrl) {
        playAvatarVideo(lastVideoUrl);
      }
    });

    fullscreenBtn.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    const avatarVideoQueue = [];
    let isPlayingAvatarQueue = false;

    function _startNextAvatarVideo(url) {
      isPlayingAvatarQueue = true;
      videoEl.classList.remove("is-playing");
      videoEl.src = url + "?t=" + Date.now();
      statusDot.className = "status-dot is-playing";
      statusLabel.textContent = "発話映像を再生中";
      replayBtn.style.display = "inline-block";

      videoEl.onloadeddata = () => {
        videoEl.classList.add("is-playing");
      };

      videoEl.play().then(() => {
        videoEl.classList.add("is-playing");
      }).catch((err) => {
        console.warn("Autoplay blocked, trying muted or manual click:", err);
        videoEl.classList.add("is-playing");
        statusLabel.textContent = "画面をクリックして再生を許可してください";
      });
    }

    function playAvatarVideo(url) {
      if (!url) return;
      if (isPlayingAvatarQueue) {
        avatarVideoQueue.push(url);
        return;
      }
      _startNextAvatarVideo(url);
    }

    function notifyVideoPlayed(videoUrl) {
      if (!videoUrl || !videoUrl.includes("/videos/talk_")) return;
      fetch("/api/avatar/video_played", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ video_url: videoUrl }),
      }).catch(() => {});
    }

    videoEl.addEventListener("ended", () => {
      const finishedUrl = videoEl.currentSrc || videoEl.src || lastVideoUrl;
      notifyVideoPlayed(finishedUrl);
      if (avatarVideoQueue.length > 0) {
        const nextUrl = avatarVideoQueue.shift();
        _startNextAvatarVideo(nextUrl);
        return;
      }
      isPlayingAvatarQueue = false;
      videoEl.classList.remove("is-playing");
      videoEl.removeAttribute("src");
      statusDot.className = "status-dot";
      statusLabel.textContent = "待機中";
      replayBtn.style.display = "none";
      lastVideoUrl = null;
    });

    // ダブルクリックで全画面切替
    document.body.addEventListener("dblclick", () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // 画面クリックで再生ロック解除
    document.body.addEventListener("click", (e) => {
      if (e.target.closest("#top-bar")) return;
      if (videoEl.paused && videoEl.classList.contains("is-playing")) {
        videoEl.play().catch(() => {});
      }
    });

    function applyAvatarState(st) {
      if (!st) return;

      if (st.source_filename && st.source_filename !== currentSourceFilename) {
        currentSourceFilename = st.source_filename;
        idleImg.src = `/avatars/${encodeURIComponent(st.source_filename)}`;
        if (sourceSelect.value !== st.source_filename) {
          loadSources();
        }
      }
      if (st.idle_video_urls || st.idle_video_url) {
        setIdleLoopVideo(st.idle_video_urls || st.idle_video_url);
      }

      if (st.reply_text) {
        subtitleSpeaker.textContent = st.persona_name || "AI";
        subtitleText.textContent = st.reply_text;
        if (showSubtitle) {
          subtitleBox.classList.remove("is-hidden");
        }
      }

      generatingOverlay.classList.remove("is-active");
      if (st.status === "generating") {
        statusDot.className = "status-dot is-generating";
        statusLabel.textContent = st.status_text || "映像生成中...";
      } else {
        if (st.status === "error") {
          statusDot.className = "status-dot";
          statusLabel.textContent = st.status_text || "エラー";
        }
      }

      if (st.video_id && st.video_id > lastVideoId && st.video_url) {
        lastVideoId = st.video_id;
        lastVideoUrl = st.video_url;
        playAvatarVideo(st.video_url);
      }
    }

    async function pollAvatarState() {
      try {
        const res = await fetch("/api/avatar/state");
        if (res.ok) {
          const st = await res.json();
          if (lastVideoId === 0 && st.video_id) {
            // 初回ロード時は過去の動画を自動再生せずIDだけ同期
            lastVideoId = st.video_id;
            lastVideoUrl = st.video_url;
            if (lastVideoUrl) replayBtn.style.display = "inline-block";
            if (st.source_filename && st.source_filename !== currentSourceFilename) {
              currentSourceFilename = st.source_filename;
              idleImg.src = `/avatars/${encodeURIComponent(st.source_filename)}`;
            }
            if (st.idle_video_urls || st.idle_video_url) {
              setIdleLoopVideo(st.idle_video_urls || st.idle_video_url);
            }
          } else {
            applyAvatarState(st);
          }
        }
      } catch (_) {}
    }

    loadSources();
    pollAvatarState();
    setInterval(pollAvatarState, 1000);

    /* ---------- 別画面からの直接音声入力＆自動送信 ---------- */
    const avatarMicBtn = document.getElementById("avatar-mic-btn");
    let avatarChatHistory = [];
    let cachedDefaultVoice = "";
    let avSpeechRec = null;
    let avMediaRecorder = null;
    let avMediaStream = null;
    let avChunks = [];
    let avIsRecording = false;
    let avIsBusy = false;
    let avPreferServerStt = false;

    async function resolveActiveVoice() {
      const saved = localStorage.getItem("mirai-voice:last-voice");
      if (saved) return saved;
      if (cachedDefaultVoice) return cachedDefaultVoice;
      try {
        const res = await fetch("/api/voices");
        const data = await res.json();
        if (data.voices && data.voices.length > 0) {
          cachedDefaultVoice = data.voices[0].name;
          return cachedDefaultVoice;
        }
      } catch (_) {}
      return "tako";
    }

    function setAvatarMicState(state) {
      if (!avatarMicBtn) return;
      avatarMicBtn.classList.remove("is-recording", "is-busy");
      if (state === "recording") {
        avatarMicBtn.classList.add("is-recording");
        avatarMicBtn.textContent = "⏹️";
      } else if (state === "busy") {
        avatarMicBtn.classList.add("is-busy");
        avatarMicBtn.textContent = "⏳";
      } else {
        avatarMicBtn.textContent = "🎤";
      }
    }

    async function fetchAndPlayTaskVideo(taskId, segText, segB64) {
      try {
        const res = await fetch("/api/avatar/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            task_id: taskId,
            text: segText,
            source_filename: currentSourceFilename,
            audio_base64_list: segB64 ? [segB64] : [],
          }),
        });
        const data = await res.json();
        if (!res.ok) return;
        if (data.video_id && data.video_id > lastVideoId) {
          lastVideoId = data.video_id;
        }
        if (data.video_url) {
          lastVideoUrl = data.video_url;
          playAvatarVideo(data.video_url);
        }
      } catch (e) {
        console.warn("Avatar video fetch error:", e);
      }
    }

    async function sendVoiceMessageFromAvatar(userText) {
      const msg = (userText || "").trim();
      if (!msg || avIsBusy) return;
      avIsBusy = true;
      setAvatarMicState("busy");

      const voice = await resolveActiveVoice();
      const personId = localStorage.getItem("mirai-voice:current-persona") || "taku";
      const llmProvider = localStorage.getItem("mirai-voice:llm-provider") || "gemini";
      const llmModel = localStorage.getItem("mirai-voice:local-model") || "";
      const ttsProvider = localStorage.getItem("mirai-voice:tts-provider") || "fish";

      let fullReply = "";
      let chain = Promise.resolve();

      try {
        const res = await fetch("/api/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: msg,
            voice,
            person_id: personId,
            history: avatarChatHistory,
            enable_tts: true,
            avatar_mode: true,
            llm_provider: llmProvider,
            llm_model: llmModel,
            tts_provider: ttsProvider,
          }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n\n");
          buffer = lines.pop();

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed.startsWith("data:")) continue;
            const jsonStr = trimmed.slice(5).trim();
            if (!jsonStr) continue;
            let payload;
            try { payload = JSON.parse(jsonStr); } catch (_) { continue; }

            if (payload.type === "text_chunk") {
              fullReply += payload.text;
            } else if (payload.type === "audio_segment" && payload.avatar_task_id) {
              const tId = payload.avatar_task_id;
              const sTxt = payload.text;
              const sB64 = payload.audio_base64;
              chain = chain.then(() => fetchAndPlayTaskVideo(tId, sTxt, sB64));
            } else if (payload.type === "done") {
              avatarChatHistory.push({ role: "user", text: msg });
              avatarChatHistory.push({ role: "model", text: fullReply });
              if (avatarChatHistory.length > 12) avatarChatHistory = avatarChatHistory.slice(-12);
              if (bc && fullReply) {
                bc.postMessage({ type: "avatar_chat_sync", userText: msg, replyText: fullReply });
              }
            }
          }
        }
        await chain;
      } catch (err) {
        console.warn("Avatar voice chat error:", err);
      } finally {
        avIsBusy = false;
        setAvatarMicState("idle");
      }
    }

    async function startAvatarMediaRecorderStt() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setAvatarMicState("idle");
        return;
      }
      try {
        avMediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        avChunks = [];
        const mimeType = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "";
        avMediaRecorder = mimeType ? new MediaRecorder(avMediaStream, { mimeType }) : new MediaRecorder(avMediaStream);
        avMediaRecorder.ondataavailable = (ev) => {
          if (ev.data && ev.data.size > 0) avChunks.push(ev.data);
        };
        avMediaRecorder.onstop = async () => {
          if (avMediaStream) {
            avMediaStream.getTracks().forEach((t) => t.stop());
            avMediaStream = null;
          }
          if (!avChunks.length) {
            setAvatarMicState("idle");
            return;
          }
          setAvatarMicState("busy");
          const blob = new Blob(avChunks, { type: avMediaRecorder.mimeType || "audio/webm" });
          const fd = new FormData();
          fd.append("audio", blob, "voice.webm");
          try {
            const res = await fetch("/api/stt", { method: "POST", body: fd });
            const data = await res.json();
            const text = (data.text || "").trim();
            if (res.ok && text) {
              await sendVoiceMessageFromAvatar(text);
              return;
            }
          } catch (_) {}
          setAvatarMicState("idle");
        };
        avIsRecording = true;
        setAvatarMicState("recording");
        avMediaRecorder.start();
      } catch (_) {
        avIsRecording = false;
        setAvatarMicState("idle");
      }
    }

    function startAvatarWebSpeechStt() {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec || avPreferServerStt) {
        startAvatarMediaRecorderStt();
        return;
      }
      avSpeechRec = new SpeechRec();
      avSpeechRec.lang = "ja-JP";
      avSpeechRec.interimResults = false;
      avSpeechRec.continuous = false;
      let finalTxt = "";
      let fallback = false;

      avSpeechRec.onstart = () => {
        avIsRecording = true;
        setAvatarMicState("recording");
      };
      avSpeechRec.onresult = (ev) => {
        for (let i = ev.resultIndex; i < ev.results.length; i++) {
          if (ev.results[i].isFinal) {
            finalTxt += ev.results[i][0].transcript;
          }
        }
      };
      avSpeechRec.onerror = (ev) => {
        avIsRecording = false;
        if (ev.error === "network" || ev.error === "service-not-allowed") {
          avPreferServerStt = true;
          fallback = true;
          startAvatarMediaRecorderStt();
          return;
        }
        setAvatarMicState("idle");
      };
      avSpeechRec.onend = () => {
        if (fallback) return;
        avIsRecording = false;
        if (finalTxt.trim()) {
          sendVoiceMessageFromAvatar(finalTxt.trim());
        } else {
          setAvatarMicState("idle");
        }
      };
      try {
        avSpeechRec.start();
      } catch (_) {
        avIsRecording = false;
        startAvatarMediaRecorderStt();
      }
    }

    function toggleAvatarMic() {
      if (avIsBusy) return;
      if (avIsRecording) {
        avIsRecording = false;
        if (avMediaRecorder && avMediaRecorder.state === "recording") {
          avMediaRecorder.stop();
        } else if (avSpeechRec) {
          avSpeechRec.stop();
        }
        return;
      }
      startAvatarWebSpeechStt();
    }

    if (avatarMicBtn) {
      avatarMicBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleAvatarMic();
      });
    }

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" && !e.repeat) {
        e.preventDefault();
        toggleAvatarMic();
      }
    });
  </script>
</body>
</html>
